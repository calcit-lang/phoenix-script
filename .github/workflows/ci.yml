name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0

      - name: Install dependencies
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Verify Snapshot and host behavior
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze dynamic-methods
          calcit calcit.cirru analyze weak-types --only schema-dynamic,unresolved-type-slot,code-dynamic --intent unresolved --summary-only --format json
          calcit calcit.cirru analyze deprecated --summary-only --format json
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
          calcit calcit.cirru docs format-md README.md --check
          calcit calcit.cirru docs check-md README.md --failures-only
          yarn test
