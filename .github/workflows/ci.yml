name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Install dependencies
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Verify Snapshot and host behavior
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze check-public --ns app.main --summary-only --format json
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
          calcit calcit.cirru docs format-md README.md --check
          calcit calcit.cirru docs check-md README.md --failures-only
          yarn test
